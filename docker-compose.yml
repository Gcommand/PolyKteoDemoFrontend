version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polykteo-frontend-debug
    ports:
      - "3000:3000"
    environment:
      # Supabase Configuration (optional)
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      # OpenAI Configuration (optional)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Next.js Configuration
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Logging Configuration (optional)
      - ENABLE_FILE_LOGGING=${ENABLE_FILE_LOGGING:-true}
      - LOG_DIR=${LOG_DIR:-/app/logs}
    volumes:
      # Optional: Mount logs directory for debugging
      # Enable this if you set ENABLE_FILE_LOGGING=true
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/search"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 